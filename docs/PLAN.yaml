# AnaOS Machine-Readable Project Plan (Optimized v2.0)
# Canonical working copy of the execution plan.

metadata:
  project_name: AnaOS
  short_name: Ana
  package_prefix: org.anaos
  manufacturer: AnaOS
  brand: Ana
  build_fingerprint_template: "AnaOS/<product>/<device>:<android_version>/<build_id>/<build_number>:user/release-keys"
  copyright: "Copyright (C) The AnaOS Project"
  primary_license: Apache-2.0
  secondary_license: GPLv2
  version: "2.1"
  format: machine-readable
  language: en
  strategy_doc: docs/STRATEGY.md
  parallel_tracks:
    - id: A
      name: aosp17_adaptation
      summary: Fast, controlled absorption of AOSP 17 platform changes
    - id: B
      name: security_privacy_primacy
      summary: Maintain security/privacy advantage; gates A and C merges
    - id: C
      name: innovation_pqc_ai
      summary: PQC roadmap + on-device AI alternatives (not cloud AI Ops)

execution_rules:
  strict_order: true
  skip_forbidden: true
  # Tracks A/B/C may advance in parallel for planning/docs/prototypes;
  # release gates (signing, VB green) remain strict.
  parallel_tracks_allowed: true
  track_b_veto_on_security_regressions: true
  private_keys_offline: true
  all_production_builds_must_be_signed: true
  verified_boot_state_required: green
  bootloader_must_be_lockable: true
  branding_must_use: ["AnaOS", "Ana", "org.anaos"]
  reproducible_builds_mandatory: true
  zero_cost_infrastructure: true
  free_tier_preferred: true
  self_hosted_when_needed: true
  not_a_stock_android_clone: true
  security_features_non_negotiable:
    - hardened_malloc
    - CFI
    - SELinux enforcing
    - verified boot
    - rollback protection

# Status values: pending | in_progress | blocked | done | skipped
# blocked_reason required when status=blocked

