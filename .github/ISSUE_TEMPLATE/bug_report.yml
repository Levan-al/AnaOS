name: Bug report
description: Report a functional defect (not a security vulnerability)
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For **security** issues use SECURITY.md — do not file a public issue.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AnaOS / build version
      placeholder: e.g. fingerprint or build number
  - type: dropdown
    id: severity
    attributes:
      label: Impact (non-security)
      options:
        - Blocker
        - Major
        - Minor
        - Cosmetic
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
