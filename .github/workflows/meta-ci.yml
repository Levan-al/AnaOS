name: meta-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Check required docs exist
        run: |
          test -f docs/PLAN.yaml
          test -f docs/BRANDING.md
          test -f docs/KEY_CEREMONY.md
          test -f docs/STRATEGY.md
          test -f docs/SECURITY_MERGE_GATE.md
          test -f docs/KEY_CEREMONY_CHECKLIST.md
          test -f docs/AOSP17_TAG_SHORTLIST.md
          test -f docs/STATUS_REPORT.md
          test -f docs/ORG_ANAOS_REBRAND.md
          test -f docs/KERNEL.md
          test -f docs/SELINUX_HARDENING.md
          test -f docs/UPDATE_SERVER.md
          test -f docs/DNS_PRIVACY.md
          test -f docs/PRIVACY_CONTROLS.md
          test -f docs/SECURITY_ARCHITECTURE.md
          test -f docs/ATTESTATION_SERVER.md
          test -f docs/TESTING.md
          test -f docs/DISTRIBUTION.md
          test -f docs/RELEASE_PROCESS.md
          test -f docs/DOCS_INDEX.md
          test -f docs/POST_BUILD_OVERLAY.md
          test -f docs/COST_OPS.md
          test -f docs/ROADMAP_NOW.md
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          test -f branding/config.yaml
          test -f device/anaos/common/anaos.mk
          test -f device/anaos/common/official.mk
      - name: Track B security gate smoke
        run: bash scripts/check-security-gate.sh
      - name: OTA metadata fixtures
        run: |
          python3 scripts/validate_update_metadata.py fixtures/ota/stable/emulator/metadata.json --channel stable
          python3 scripts/validate_update_metadata.py fixtures/ota/stable/emulator/metadata.bad-host.json --channel stable --expect-fail
          python3 scripts/validate_update_metadata.py fixtures/ota/stable/emulator/metadata.channel-mismatch.json --channel stable --expect-fail
          python3 -m unittest discover -s scripts -p 'test_validate_update_metadata.py' -v
      - name: adevtool unit tests
        working-directory: adevtool
        run: python3 -m unittest discover -s . -p 'test_*.py' -v
      - name: Validate branding config
        run: |
          python3 - <<'PY'
          import yaml
          with open("branding/config.yaml", encoding="utf-8") as f:
              data = yaml.safe_load(f)
          assert data["package_prefix"] == "org.anaos", data
          assert data["project_name"] == "AnaOS", data
          print("branding/config.yaml OK")
          PY
      - name: Website scaffold present
        run: |
          test -f website/index.html
          test -f website/styles.css
          test -f infra/cdn/r2.wrangler.toml.example
          test -f device/anaos/shiba/sepolicy/private/anaos_updater.te
          test -f platform_manifest/pin-android-17.0.0_r1.xml
          test -f docs/PHASE_D.md
